[project]
name = "outlook-mail-station"
version = "0.1.0"
description = "Independent Outlook mail station for account import, inbox sync and sending."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
